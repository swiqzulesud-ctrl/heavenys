plugins {
    id "fabric-loom" version "1.9-SNAPSHOT"
    id "maven-publish"
    id "java"
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    // Modrinth / CurseMaven for Sodium, Iris, Lithium
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
}

dependencies {
    // Minecraft + Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ----- Performance stack -----
    // Sodium — GPU-accelerated rendering
    modImplementation "maven.modrinth:sodium:${project.sodium_version}"

    // Iris — shader support (depends on Sodium)
    modImplementation "maven.modrinth:iris:${project.iris_version}"

    // Lithium — server/client logic optimisation
    modImplementation "maven.modrinth:lithium:${project.lithium_version}"

    // ----- Config -----
    // Cloth Config — runtime configuration API used by many mods
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Gson is already on the classpath via Minecraft; no extra dep needed for JSON config.
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version

    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand project.properties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}

// Reproducible builds
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
