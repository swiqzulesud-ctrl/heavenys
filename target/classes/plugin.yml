name: HeavenEssentials
version: '1.0.0'
main: dev.heaven.essentials.HeavenEssentials
api-version: '26.2'
description: A Heaven-themed Lifesteal system combined with a lightweight Essentials-style command suite.
author: Heaven

commands:
  heartsteal:
    description: Open the Lifesteal admin GUI or reload the plugin configuration.
    usage: /heartsteal [reload]
    aliases: [hs, lifesteal]
  gm:
    description: Change your own or another player's game mode.
    usage: /gm <0|1|2|3|survival|creative|adventure|spectator> [player]
    aliases: [gamemode]
  fly:
    description: Toggle flight for yourself or another player.
    usage: /fly [player]
  heal:
    description: Restore full health for yourself or another player.
    usage: /heal [player]
  feed:
    description: Restore full hunger for yourself or another player.
    usage: /feed [player]
  god:
    description: Toggle invulnerability for yourself or another player.
    usage: /god [player]
  speed:
    description: Set walk or fly speed for yourself or another player.
    usage: /speed <1-10> [player]
  tp:
    description: Teleport to a player, or teleport a player to another player.
    usage: /tp <target> | /tp <player> <target>
  tphere:
    description: Teleport a player to you.
    usage: /tphere <player>
    aliases: [tph]
  tpall:
    description: Teleport every online player to you.
    usage: /tpall
  spawn:
    description: Teleport to the global spawn point.
    usage: /spawn [player]
  setspawn:
    description: Set the global spawn point at your current location.
    usage: /setspawn
  back:
    description: Return to your previous location.
    usage: /back
  invsee:
    description: View another player's inventory.
    usage: /invsee <player>
    aliases: [inv]
  enderchest:
    description: Open your own or another player's ender chest.
    usage: /enderchest [player]
    aliases: [ec, echest]
  clear:
    description: Clear your own or another player's inventory.
    usage: /clear [player]
    aliases: [ci, clearinventory]
  repair:
    description: Repair the item in your hand or your whole inventory.
    usage: /repair [all]
    aliases: [fix]
  workbench:
    description: Open a portable crafting table.
    usage: /workbench
    aliases: [wb, craft]
  anvil:
    description: Open a portable anvil.
    usage: /anvil
  hat:
    description: Wear the item in your main hand as a hat.
    usage: /hat
  top:
    description: Teleport to the highest block at your position.
    usage: /top
  bottom:
    description: Teleport to the lowest safe block at your position.
    usage: /bottom
  day:
    description: Set the time of your world to day.
    usage: /day
  night:
    description: Set the time of your world to night.
    usage: /night
  sun:
    description: Clear the weather in your world.
    usage: /sun
  rain:
    description: Start rain in your world.
    usage: /rain
  broadcast:
    description: Broadcast a message to the whole server.
    usage: /broadcast <message>
    aliases: [bc]
  msg:
    description: Send a private message to a player.
    usage: /msg <player> <message>
    aliases: [tell, w, whisper, message]
  reply:
    description: Reply to the last private message you received or sent.
    usage: /reply <message>
    aliases: [r]
  ignore:
    description: Toggle ignoring private messages from a player.
    usage: /ignore <player>
    aliases: [unignore]

