name: Build

on:
  push:
    branches: [ main, "cursor/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compile + test everything, and produce the in-game mod jar and the launcher fat jar.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build client + launcher (with tests)
        run: ./gradlew :client:build :launcher:test :launcher:fatJar --stacktrace
      - name: Upload client mod jar
        uses: actions/upload-artifact@v4
        with:
          name: heavenys-client-mod
          path: client/build/libs/*.jar
      - name: Upload launcher (fat jar)
        uses: actions/upload-artifact@v4
        with:
          name: heavenys-launcher-jar
          path: launcher/build/libs/*-all.jar

  # Package the launcher as a Windows executable installer via jpackage.
  windows-installer:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # WiX Toolset 3.x is required by jpackage to build .exe/.msi installers.
      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y
        continue-on-error: true
      - name: Build Windows .exe installer
        id: exe
        run: ./gradlew :launcher:jpackage -PinstallerType=exe --stacktrace
        continue-on-error: true
      - name: Fallback — portable app-image
        if: steps.exe.outcome != 'success'
        run: ./gradlew :launcher:jpackage --stacktrace
      - name: Upload Windows installer / app-image
        uses: actions/upload-artifact@v4
        with:
          name: heavenys-launcher-windows
          path: launcher/build/jpackage/**
