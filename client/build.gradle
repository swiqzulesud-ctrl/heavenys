plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Modrinth maven hosts Sodium / Iris / Lithium artifacts.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

loom {
    // Split the mod source set so client-only code cannot accidentally leak
    // onto a (dedicated) server. Heavenys is a client mod.
    splitEnvironmentSourceSets()

    mods {
        "heavenys" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Performance & rendering stack: Sodium (FPS), Iris (shaders), Lithium (tick perf).
    // Declared as runtime-only dependencies of the dev client so we integrate the
    // stack without compiling against it (keeps the client lightweight & decoupled).
    if (project.enable_render_stack.toBoolean()) {
        modRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
        modRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
        modRuntimeOnly "maven.modrinth:lithium:${project.lithium_version}"
    }

    // Simple Voice Chat — proximity/modular voice chat. Runtime-only in dev; end users
    // install it alongside Heavenys (declared as a suggestion in fabric.mod.json).
    if (project.enable_voicechat.toBoolean()) {
        modRuntimeOnly "maven.modrinth:simple-voice-chat:${project.voicechat_version}"
    }

    // Fabulously-Optimized-style performance foundation (open-source optimization mods).
    // Managed/toggled per-mod from the launcher's Optimization page for end users.
    if (project.enable_optimization.toBoolean()) {
        modRuntimeOnly "maven.modrinth:ferrite-core:${project.ferritecore_version}"
        modRuntimeOnly "maven.modrinth:entityculling:${project.entityculling_version}"
        modRuntimeOnly "maven.modrinth:immediatelyfast:${project.immediatelyfast_version}"
        modRuntimeOnly "maven.modrinth:moreculling:${project.moreculling_version}"
        modRuntimeOnly "maven.modrinth:krypton:${project.krypton_version}"
        modRuntimeOnly "maven.modrinth:dynamic-fps:${project.dynamicfps_version}"
        modRuntimeOnly "maven.modrinth:fastquit:${project.fastquit_version}"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
