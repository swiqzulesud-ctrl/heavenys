# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Loom
loom_version=1.17.16

#
# Toolchain / target Minecraft version.
#
# NOTE (Heavenys Client): The client is designed for the "latest 26.x" Minecraft
# generation. However, at the time of setup the Fabric mapping toolchain
# (Yarn / official mappings) and a matching Java runtime were not yet published
# for 26.x, so the build/dev environment targets the latest fully-mapped stable
# release. Bumping to 26.x is a one-line change here once mappings ship.
#
# See AGENTS.md -> "Cursor Cloud specific instructions" for details.

minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3

# Fabric API
fabric_version=0.141.5+1.21.11

# Performance / rendering stack (Sodium + Iris + Lithium).
# Pulled from the Modrinth maven as dev runtime dependencies. Toggle with
# -Penable_render_stack=false if running under software (headless) OpenGL.
enable_render_stack=true
sodium_version=mc1.21.11-0.8.13-fabric
iris_version=1.10.7+1.21.11-fabric
lithium_version=mc1.21.11-0.21.4-fabric

# Simple Voice Chat (the standard modular proximity voice-chat mod).
# Toggle with -Penable_voicechat=false.
enable_voicechat=true
voicechat_version=fabric-1.21.11-2.6.21

# Mod Properties
mod_version=1.0.0
maven_group=com.heavenys
archives_base_name=heavenys-client
